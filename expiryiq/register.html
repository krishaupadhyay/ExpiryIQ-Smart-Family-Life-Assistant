<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — ExpiryIQ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900">

<!-- TOAST -->
<div id="toast" class="toast fixed top-6 right-6 z-50 opacity-0 pointer-events-none -translate-y-2">
  <div class="bg-gray-900 text-white px-5 py-3 rounded-lg shadow-lg text-sm font-medium" id="toastMsg">Done</div>
</div>

<!-- NAVBAR -->
<nav class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-gray-100">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl grad-btn flex items-center justify-center text-white font-bold">Q</div>
      <span class="font-bold text-lg">ExpiryIQ</span>
    </a>
    <div class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-600">
      <a href="index.html#features" class="hover:text-indigo-600">Features</a>
      <a href="index.html#how" class="hover:text-indigo-600">How It Works</a>
    </div>
    <div class="flex items-center gap-3" id="navButtons">
      <a href="login.html" class="text-sm font-semibold text-gray-700 hover:text-indigo-600 px-4 py-2">Sign In</a>
      <a href="register.html" class="grad-btn text-white text-sm font-semibold px-5 py-2.5 rounded-lg shadow-sm">Get Started</a>
    </div>
    <div class="hidden items-center gap-4" id="navUser">
      <span class="text-sm text-gray-600">Hi, <span id="navUserName" class="font-semibold text-gray-900"></span></span>
      <a href="dashboard.html" class="text-sm font-semibold text-indigo-600 px-3 py-2">Dashboard</a>
      <button onclick="logoutUser()" class="text-sm font-semibold text-gray-500 hover:text-red-500 px-3 py-2">Log Out</button>
    </div>
  </div>
</nav>

<!-- REGISTER FORM -->
<div class="min-h-[80vh] flex items-center justify-center grad-hero px-6 py-16">
  <div class="bg-white rounded-2xl shadow-xl p-10 w-full max-w-md border border-gray-100">
    <h2 class="text-2xl font-extrabold mb-1">Create your family account</h2>
    <p class="text-gray-500 text-sm mb-7">Start managing your household in minutes</p>
    <form id="registerForm">
      <label class="text-sm font-semibold text-gray-700">Full name</label>
      <input id="regName" type="text" required placeholder="Prachi Rana" class="input-field w-full mt-1.5 mb-4 px-4 py-2.5 border border-gray-200 rounded-lg text-sm">
      <label class="text-sm font-semibold text-gray-700">Email</label>
      <input id="regEmail" type="email" required placeholder="you@example.com" class="input-field w-full mt-1.5 mb-4 px-4 py-2.5 border border-gray-200 rounded-lg text-sm">
      <label class="text-sm font-semibold text-gray-700">Password</label>
      <input id="regPassword" type="password" required minlength="6" placeholder="Minimum 6 characters" class="input-field w-full mt-1.5 mb-4 px-4 py-2.5 border border-gray-200 rounded-lg text-sm">
      <label class="text-sm font-semibold text-gray-700">Confirm password</label>
      <input id="regConfirm" type="password" required placeholder="Re-enter password" class="input-field w-full mt-1.5 mb-2 px-4 py-2.5 border border-gray-200 rounded-lg text-sm">
      <p id="regError" class="text-red-500 text-xs mb-3 hidden">Passwords do not match.</p>
      <button type="submit" class="grad-btn w-full text-white font-semibold py-3 rounded-lg mt-4">Create Account</button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-6">Already have an account? <a href="login.html" class="text-indigo-600 font-semibold">Sign In</a></p>
  </div>
</div>

<script src="js/toast.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    const errEl = document.getElementById('regError');

    const result = registerUser(name, email, password, confirm);
    if (!result.ok) {
      errEl.textContent = result.error;
      errEl.classList.remove('hidden');
      return;
    }
    errEl.classList.add('hidden');
    toast('Account created — welcome to ExpiryIQ!');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
  });
</script>
</body>
</html>
